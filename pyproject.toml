[project]
name = "steward"
version = "0.1.0"
description = "A customer service agent that can be trusted with the records."
readme = "README.md"
authors = [
    { name = "sade", email = "sade.khosravi@gmail.com" }
]
# Upper bound inherited from tau2, which requires >=3.12,<3.14.
requires-python = ">=3.12,<3.14"
dependencies = [
    "tau2",
    "python-dotenv>=1.0.0",
    "pydantic-ai-slim[openai]>=2.32.1",
    "langgraph>=1.2.11",
    "langfuse>=4.14.4",
    # Used directly, to hold the model to the tool schema it was shown. Arrives
    # transitively anyway; declared because we import it.
    "jsonschema>=4.20.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

# tau2 is consumed as a pinned upstream library, never forked.
# `rev` is the tip of the codex/pine-independent-leaderboard branch; bump it
# deliberately, and re-run scripts/bootstrap_data.py so code and data agree.
[tool.uv.sources]
tau2 = { git = "https://github.com/sierra-research/tau2-bench", rev = "357166111bb6e426f554cdd6ee34245efe1ec3ab" }

# Top-level modules under src/. Add an entry when you add a module.
[tool.uv.build-backend]
module-name = ["adapters", "agents", "core", "llm", "patterns", "tools", "tracing", "workflows"]

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
